name: mobile_jyotish
description: "Offline Vedic astrology (Jyotish) app powered by the Swiss Ephemeris."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  dio: ^5.9.2
  drift: ^2.33.0
  sqlite3: ^3.3.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^10.3.1
  flutter_animate: ^4.5.2
  google_fonts: ^8.1.0
  http: ^1.6.0
  pdf: ^3.12.0
  printing: ^5.14.3
  intl: ^0.20.2
  open_file: ^3.5.11
  sweph: ^4.1.0+2.10.3
  timezone: ^0.11.1
  package_info_plus: ^10.2.1
  flutter_markdown_plus: ^1.0.12
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/cities.tsv.gz
    - assets/google_fonts/
    - assets/fonts/
    - assets/docs/
  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0d0a1b"
  adaptive_icon_foreground: "assets/app_icon.png"
