name: Android build

on:
  push:
    branches-ignore: ['ci-logs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Host build of the Swiss Ephemeris so the ephemeris unit tests run
      # (the APK compiles its own copy through the sweph plugin).
      - name: Build Swiss Ephemeris for tests
        run: tool/build_sweph_test_lib.sh

      - name: Unit and widget tests
        run: flutter test --timeout 120s

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jyotish-cosmic-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Test builds are published as pre-releases so the APK has a direct
      # download link. Pre-releases are ignored by the in-app update check.
      - name: Publish test pre-release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Test build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Test APK built from `${{ github.ref_name }}` at ${{ github.sha }}.
            Install on Android with "Install unknown apps" allowed. Signed with the debug key (testing only).
          files: build/app/outputs/flutter-apk/app-release.apk
